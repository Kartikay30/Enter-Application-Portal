# =============================================
# nixpacks.toml - Railway Build Configuration
# =============================================
# Railway uses Nixpacks to auto-detect and build your project.
# This file tells Nixpacks EXACTLY how to build our fullstack app:
#   1. Install Node.js AND Python
#   2. Build the React frontend (npm run build)
#   3. Copy the built frontend into backend/static/
#   4. Install Python dependencies
# =============================================

# We need both Node.js (for React) and Python (for FastAPI)
[phases.setup]
nixPkgs = ["nodejs_20", "python311", "gcc"]

# Install dependencies for both frontend and backend
[phases.install]
cmds = [
    "cd frontend && npm install",
    "cd backend && pip install -r requirements.txt"
]

# Build the React frontend and copy it to backend/static/
[phases.build]
cmds = [
    "cd frontend && npm run build",
    "cp -r frontend/dist backend/static"
]

# Start command
[start]
cmd = "cd backend && python run.py"
