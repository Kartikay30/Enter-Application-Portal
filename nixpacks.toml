# =============================================
# nixpacks.toml - Railway Build Configuration
# =============================================
# Tells Railway how to build our fullstack app:
#   1. Install Node.js AND Python
#   2. Build the React frontend
#   3. Copy built files into backend/static/
#   4. Install Python dependencies
# =============================================

# We need both Node.js (for React) and Python (for FastAPI)
[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip", "gcc"]

# Install dependencies for both frontend and backend
[phases.install]
cmds = [
    "cd frontend && npm ci",
    "cd backend && python3 -m pip install -r requirements.txt"
]

# Build the React frontend and copy it to backend/static/
[phases.build]
cmds = [
    "cd frontend && npm run build",
    "cp -r frontend/dist backend/static"
]

# Start command
[start]
cmd = "cd backend && python3 run.py"
